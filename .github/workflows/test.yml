name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: regenic-ai/regenic
          path: regenic
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            regenic/pnpm-lock.yaml
      - name: Install Regenic
        working-directory: regenic
        run: pnpm install --frozen-lockfile
      - name: Build connector contract
        working-directory: regenic
        run: pnpm --filter @regenic/plugin-host --filter @regenic/connector-contract --filter @regenic/connector-test-utils build
      - name: Install connector
        run: pnpm install --frozen-lockfile
      - name: Test
        env:
          REGENIC_ROOT: ${{ github.workspace }}/regenic
        run: pnpm test
